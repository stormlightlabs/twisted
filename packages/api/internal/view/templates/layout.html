{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Twister{{end}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  {{block "head" .}}{{end}}
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">twister</a>
      <div class="nav-links">
        <a href="/">Search</a>
        <a href="/docs">API Docs</a>
      </div>
    </div>
  </nav>
  <main class="main">
    {{block "content" .}}{{end}}
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span>Twister &mdash; search for <a href="https://tangled.sh" target="_blank" rel="noopener">Tangled</a></span>
    </div>
  </footer>
  {{block "scripts" .}}{{end}}
</body>
</html>{{end}}
